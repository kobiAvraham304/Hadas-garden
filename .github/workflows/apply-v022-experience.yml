name: Apply v0.22 schedule experience

on:
  push:
    branches:
      - agent/v0.22.0-schedule-experience
    paths:
      - '.github/workflows/apply-v022-experience.yml'

permissions:
  contents: write

concurrency:
  group: hadas-v022-experience
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.22.0-schedule-experience
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Align patch guards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply-v022-experience.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('weekStart, mode, generated: cleanGenerated, finalRows, keptCount: kept.length,','weekStart, mode, keptCount: kept.length, generated: cleanGenerated, finalRows,')
          s=s.replace('weekStart, selectedDates:dates, mode, generated: cleanGenerated, finalRows, keptCount: kept.length,','weekStart, selectedDates:dates, mode, keptCount: kept.length, generated: cleanGenerated, finalRows,')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Apply v0.22 changes
        run: python3 scripts/apply-v022-experience.py
      - name: Full QA
        run: |
          npm test
          npm run check
          node --check app.js
          node --check api/index.js
          node --check lib/server.js
          node --check lib/schedule.js
          node --check lib/matching.js
          node --check lib/auto-schedule.js
          for file in handlers/*.js; do node --check "$file"; done
      - name: Commit release candidate
        run: |
          rm -f scripts/apply-v022-experience.py .github/workflows/apply-v022-experience.yml
          git config user.name "Hadas Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "0.22.0 schedule experience and auto-scheduling upgrade"
          git push origin HEAD:agent/v0.22.0-schedule-experience
