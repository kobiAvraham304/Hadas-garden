name: Apply v0.20 advisor cleanup

on:
  push:
    branches:
      - agent/v0.20.0-quality

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[v020-dbclean]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.20.0-quality
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply cleanup
        run: python3 scripts/apply-v020-advisor-cleanup.py
      - name: QA
        run: |
          npm test
          npm run check
          node --check app.js
          node --check lib/server.js
          for file in handlers/*.js; do node --check "$file"; done
      - name: Commit cleanup
        run: |
          git config user.name "Hadas Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add supabase/schema.sql supabase/update-v0.20.0.sql tests/v020.test.js
          git commit -m "0.20.0 advisor cleanup [v020-dbclean]"
          git push origin HEAD:agent/v0.20.0-quality
