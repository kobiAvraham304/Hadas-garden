name: Apply v0.20.0 maintenance

on:
  push:
    branches:
      - agent/v0.20.0-quality

permissions:
  contents: write

concurrency:
  group: hadas-v020-maintenance
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[v020-applied]') && !contains(github.event.head_commit.message, '[v020-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.20.0-quality
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply guarded patch
        run: |
          python3 scripts/apply-v020-maintenance.py
          python3 - <<'PY'
          from pathlib import Path
          for name in ['tests/api.test.js','tests/router.test.js']:
              path=Path(name)
              text=path.read_text(encoding='utf-8')
              count=text.count("'0.19.0'")
              if count < 1:
                  raise SystemExit(f'expected legacy version assertion in {name}')
              path.write_text(text.replace("'0.19.0'","'0.20.0'"),encoding='utf-8')
          PY
      - name: Run full QA
        run: |
          npm test
          npm run check
          node --check app.js
          node --check api/index.js
          node --check lib/server.js
          node --check lib/schedule.js
          node --check lib/matching.js
          node --check lib/auto-schedule.js
          for file in handlers/*.js; do node --check "$file"; done
      - name: Commit release candidate
        run: |
          git config user.name "Hadas Release Bot"
          git config user.email "actions@users.noreply.github.com"
          rm -f .github/workflows/qa.yml
          git add -A
          git commit -m "0.20.0 quality and performance [v020-applied]"
          git push origin HEAD:agent/v0.20.0-quality
