name: Apply v0.21 scheduling

on:
  push:
    branches:
      - agent/v0.21.0-scheduling

permissions:
  contents: write

concurrency:
  group: hadas-v021-scheduling
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[v021-applied]') && !contains(github.event.head_commit.message, '[v021-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.21.0-scheduling
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare and apply guarded patch
        run: |
          python3 scripts/prepare-v021-patch.py
          python3 -m py_compile scripts/apply-v021-scheduling.py
          python3 scripts/apply-v021-scheduling.py
      - name: Full QA
        run: |
          npm test
          npm run check
          node --check app.js
          node --check api/index.js
          node --check lib/server.js
          node --check lib/schedule.js
          node --check lib/matching.js
          node --check lib/auto-schedule.js
          for file in handlers/*.js; do node --check "$file"; done
      - name: Commit release candidate
        run: |
          git config user.name "Hadas Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "0.21.0 scheduling reliability [v021-applied]"
          git push origin HEAD:agent/v0.21.0-scheduling
