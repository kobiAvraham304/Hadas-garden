name: Apply v0.21 scheduling

on:
  push:
    branches:
      - agent/v0.21.0-scheduling

permissions:
  contents: write

concurrency:
  group: hadas-v021-scheduling
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[v021-applied]') && !contains(github.event.head_commit.message, '[v021-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.21.0-scheduling
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply guarded patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply-v021-scheduling.py')
          lines=p.read_text(encoding='utf-8').splitlines()
          out=[]; i=0
          while i<len(lines):
              line=lines[i]
              if line.lstrip().startswith('regex_once(') and line.count('"')%2==1:
                  combined=line; i+=1
                  while i<len(lines) and combined.count('"')%2==1:
                      combined += r'\n' + lines[i]
                      i+=1
                  out.append(combined)
              else:
                  out.append(line); i+=1
          text='\n'.join(out)+'\n'
          bad="""# Sort PDF cell items by role before drawing.
replace_once('app.js',
'''      const items = shifts.filter((shift) => shift.shift_date === dateISO(date) && shift.class_id === classItem.id);''',
'''      const items = sortScheduleRows(shifts.filter((shift) => shift.shift_date === dateISO(date) && shift.class_id === classItem.id));''')
"""
          if bad not in text: raise SystemExit('PDF patch helper block not found')
          text=text.replace(bad,"# PDF role sorting is applied after the guarded patch.\n",1)
          p.write_text(text,encoding='utf-8')
          PY
          python3 -m py_compile scripts/apply-v021-scheduling.py
          python3 scripts/apply-v021-scheduling.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.js'); s=p.read_text(encoding='utf-8')
          old="""      const items = shifts.filter((shift) => shift.shift_date === iso && shift.class_id === classItem.id)
        .sort((a, b) => String(a.start_time).localeCompare(String(b.start_time)) || (employeeById(a.employee_id)?.full_name || '').localeCompare(employeeById(b.employee_id)?.full_name || '', 'he'));"""
          new="""      const items = sortScheduleRows(shifts.filter((shift) => shift.shift_date === iso && shift.class_id === classItem.id));"""
          if s.count(old)!=1: raise SystemExit(f'PDF actual sort guard failed: {s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Full QA
        run: |
          npm test
          npm run check
          node --check app.js
          node --check api/index.js
          node --check lib/server.js
          node --check lib/schedule.js
          node --check lib/matching.js
          node --check lib/auto-schedule.js
          for file in handlers/*.js; do node --check "$file"; done
      - name: Commit release candidate
        run: |
          git config user.name "Hadas Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "0.21.0 scheduling reliability [v021-applied]"
          git push origin HEAD:agent/v0.21.0-scheduling
