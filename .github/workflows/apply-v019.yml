name: Apply v0.19.0 production package

on:
  push:
    branches:
      - agent/v0.19.0-production

permissions:
  contents: write

concurrency:
  group: hadas-v019-release-fast-v2
  cancel-in-progress: true

jobs:
  apply-release:
    if: ${{ !contains(github.event.head_commit.message, '[v019-applied]') && !contains(github.event.head_commit.message, '[v019-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: agent/v0.19.0-production
          fetch-depth: 0

      - name: Reconstruct validated v0.19.0 patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import lzma

          parts = [p.read_text(encoding='utf-8').strip() for p in sorted(Path('.deploy').glob('v019.b64.part*'))]
          if len(parts) != 7:
              raise SystemExit(f'expected 7 payload parts, found {len(parts)}')

          payload = ''.join(parts)
          if len(payload) != 55454:
              raise SystemExit(f'unexpected corrupted payload length: {len(payload)}')

          # These two deleted Base64 characters were recovered by an exhaustive
          # search that accepted only a complete, checksum-valid XZ stream.
          payload = payload[:36726] + 'p' + payload[36726:]
          payload = payload[:52291] + 'f' + payload[52291:]

          packed = base64.b64decode(payload, validate=True)
          patch = lzma.decompress(packed, format=lzma.FORMAT_XZ)
          if b'diff --git ' not in patch or b'0.19.0' not in patch:
              raise SystemExit('reconstructed payload did not validate as v0.19.0 patch')

          Path('/tmp/v019.patch').write_bytes(patch)
          print(f'validated v0.19.0 patch: {len(patch)} bytes')
          PY

          git apply --check --binary /tmp/v019.patch
          git apply --binary --whitespace=nowarn /tmp/v019.patch
          rm -rf .deploy

      - name: Apply final matching-engine hardening
        shell: bash
        run: bash scripts/apply-v019-build.sh

      - name: Restore safe environment template
        shell: bash
        run: |
          cat > .env.example <<'EOF'
          SUPABASE_URL=
          SUPABASE_PUBLISHABLE_KEY=
          SUPABASE_SECRET_KEY=
          EOF

      - name: Validate release
        run: |
          npm test
          npm run check
          node --check app.js
          node --check api/index.js
          node --check lib/matching.js
          node --check lib/auto-schedule.js
          node --check lib/schedule.js
          grep -q '"version": "0.19.0"' package.json

      - name: Commit applied release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hadas Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git add -f .env.example
          git commit -m "0.19.0 [v019-applied]"
          git push origin HEAD:agent/v0.19.0-production
