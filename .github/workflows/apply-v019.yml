# v0.19.0 focused recovery workflow
name: Apply v0.19.0 production package

on:
  push:
    branches:
      - agent/v0.19.0-production

permissions:
  contents: write

concurrency:
  group: hadas-v019-release
  cancel-in-progress: true

jobs:
  apply-release:
    if: ${{ !contains(github.event.head_commit.message, '[v019-applied]') && !contains(github.event.head_commit.message, '[v019-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: agent/v0.19.0-production
          fetch-depth: 0

      - name: Reconstruct and validate v0.19.0 patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import heapq
          import lzma

          paths = sorted(Path('.deploy').glob('v019.b64.part*'))
          if not paths:
              raise SystemExit('v0.19.0 payload parts are missing')

          parts = [p.read_text(encoding='utf-8').strip() for p in paths]
          alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
          joined = ''.join(parts)

          def decoded(candidate: str):
              padded = candidate + ('=' * ((4 - len(candidate) % 4) % 4))
              try:
                  return base64.b64decode(padded, validate=True)
              except Exception:
                  return None

          def inspect(candidate: str):
              packed = decoded(candidate)
              if packed is None:
                  return (-1, -1, False, None)
              dec = lzma.LZMADecompressor(format=lzma.FORMAT_XZ)
              produced = 0
              consumed = 0
              step = 128
              try:
                  for i in range(0, len(packed), step):
                      block = packed[i:i + step]
                      produced += len(dec.decompress(block))
                      consumed = i + len(block)
                      if dec.eof:
                          patch = lzma.decompress(packed, format=lzma.FORMAT_XZ)
                          valid = b'diff --git ' in patch and b'0.19.0' in patch
                          return (10**9 + produced if valid else produced, consumed, valid, patch if valid else None)
              except lzma.LZMAError:
                  pass
              return (produced, consumed, False, None)

          base = inspect(joined)
          if base[2]:
              patch = base[3]
          else:
              max_chunk = max(len(p) for p in parts[:-1])
              short_middle = [i for i, p in enumerate(parts[:-1]) if len(p) == max_chunk - 1]
              if len(short_middle) != 1 or len(joined) % 4 != 2:
                  raise SystemExit(f'unexpected payload shape: lengths={[len(p) for p in parts]}, total={len(joined)}')

              starts = []
              cursor = 0
              for p in parts:
                  starts.append(cursor)
                  cursor += len(p)
              mid = short_middle[0]
              mid_start = starts[mid]
              mid_end = mid_start + len(parts[mid])

              first_center = max(mid_start, min(mid_end, int(base[1] * 4 / 3)))
              first_radius = 380
              first_lo = max(mid_start, first_center - first_radius)
              first_hi = min(mid_end, first_center + first_radius)
              print('base progress:', base[:2], 'first search:', (first_lo, first_hi), flush=True)

              top = []
              for pos in range(first_lo, first_hi + 1):
                  for ch in alphabet:
                      candidate = joined[:pos] + ch + joined[pos:]
                      score = inspect(candidate)
                      item = (score[0], score[1], pos, ch, candidate)
                      if len(top) < 8:
                          heapq.heappush(top, item)
                      elif item[:2] > top[0][:2]:
                          heapq.heapreplace(top, item)

              top.sort(reverse=True)
              print('top first candidates:', [(x[0], x[1], x[2], x[3]) for x in top], flush=True)

              found = None
              for first_score, first_consumed, first_pos, first_ch, first_candidate in top:
                  second_center = max(first_pos + 1, int(first_consumed * 4 / 3))
                  second_radius = 420
                  second_lo = max(first_pos + 1, second_center - second_radius)
                  second_hi = min(len(first_candidate), second_center + second_radius)
                  print('second search:', (first_pos, first_ch, first_score, first_consumed), (second_lo, second_hi), flush=True)

                  for pos in range(second_lo, second_hi + 1):
                      for ch in alphabet:
                          candidate = first_candidate[:pos] + ch + first_candidate[pos:]
                          score = inspect(candidate)
                          if score[2]:
                              found = (first_pos, first_ch, pos, ch, score[3])
                              break
                      if found:
                          break
                  if found:
                      break

              if found is None:
                  raise SystemExit('focused recovery did not find a fully valid Base64/XZ patch')

              first_pos, first_ch, second_pos, second_ch, patch = found
              print(f'recovered v0.19.0 payload: first=({first_pos},{first_ch!r}) second=({second_pos},{second_ch!r})', flush=True)

          Path('/tmp/v019.patch').write_bytes(patch)
          print(f'validated v0.19.0 patch: {len(patch)} bytes', flush=True)
          PY

          git apply --check --binary /tmp/v019.patch
          git apply --binary --whitespace=nowarn /tmp/v019.patch
          rm -rf .deploy

      - name: Apply final matching-engine hardening
        shell: bash
        run: bash scripts/apply-v019-build.sh

      - name: Validate release
        run: |
          npm test
          npm run check
          node --check app.js
          node --check api/index.js
          node --check lib/matching.js
          node --check lib/auto-schedule.js
          node --check lib/schedule.js
          grep -q '"version": "0.19.0"' package.json

      - name: Commit applied release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hadas Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "0.19.0 [v019-applied]"
          git push origin HEAD:agent/v0.19.0-production
