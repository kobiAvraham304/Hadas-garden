<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>הקמת מערכת הדס</title><link rel="stylesheet" href="/styles.css"/><script src="/setup.js" defer></script></head>
<body><main class="auth-shell"><section class="auth-card wide-auth"><div class="brand-mark">הדס</div><h1>הקמה ראשונית</h1><p class="muted">העמוד יוצר את אילנית ולינור ללא מייל וללא Supabase Auth.</p><div id="setupStatus" class="notice">בודק את המערכת…</div><form id="setupForm" class="stack-form hidden"><label>קוד הקמה<input name="bootstrapToken" type="password" required/></label><label>מספר הטלפון של אילנית<input name="ilanitPhone" type="tel" required/></label><label>מספר הטלפון של לינור<input name="linorPhone" type="tel" required/></label><button class="primary-btn" type="submit">הקמת לינור ואילנית</button></form><p class="small-note">הסיסמה הראשונית לשתיהן תהיה <strong>hadas</strong>.</p><a class="text-link" href="/">חזרה לכניסה</a></section></main></body></html>
