<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../styles.css"><title>QA טופס עובד</title></head><body><dialog class="modal" open id="employeeDialog"><form class="modal-card large-modal" id="employeeForm"><div class="modal-heading"><div><p class="eyebrow">כרטיס צוות</p><h3>פרטי עובד</h3></div><button type="button" class="icon-btn">×</button></div><div class="notice privacy-notice">🔒 המידע בכרטיס העובד חסוי.</div><nav class="employee-form-nav"><button class="active" type="button"><span>1</span>פרטים</button><button type="button"><span>2</span>שיוך</button><button type="button"><span>3</span>משרה</button><button type="button"><span>4</span>ימים ושעות</button></nav><section class="form-section employee-form-section"><div class="form-section-heading"><div><span class="section-number">1</span><div><h4>פרטים בסיסיים</h4><p>פרטי הזיהוי וההרשאה למערכת.</p></div></div></div><div class="form-grid"><label><span class="field-title">שם מלא</span><input value="לינוי דגן"></label><label><span class="field-title">מספר טלפון</span><input value="0540000000"></label><label><span class="field-title">תפקיד במעון</span><select><option>סייעת מובילה</option></select><small>התפקיד הקבוע של העובד במעון.</small></label><label><span class="field-title">הרשאה במערכת</span><select><option>עובד</option></select><small>קובע אילו מסכים ופעולות יהיו זמינים.</small></label></div></section><section class="form-section employee-form-section"><div class="form-section-heading"><div><span class="section-number">2</span><div><h4>שיוך לכיתות</h4><p>בחרו את צורת העבודה הרגילה.</p></div></div></div><div class="form-grid"><label><span class="field-title">אופן שיוך</span><select><option>כיתה קבועה</option></select></label><label><span class="field-title">בחירת כיתה</span><select><option>אודם</option></select></label></div></section><details class="employee-form-details" open><summary><span class=
