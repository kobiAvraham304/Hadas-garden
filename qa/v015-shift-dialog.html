<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="../styles.css"><title>QA 0.15 Shift Dialog</title></head><body><dialog class="modal" open><form class="modal-card large-modal"><div class="modal-heading"><div><p class="eyebrow">שיבוץ חכם</p><h3>הוספת שיבוץ</h3><p class="muted">בחרו כיתה, שעות ועובד מתאים.</p></div><button class="icon-btn">×</button></div><div class="form-grid"><label>תאריך<input type="date" value="2026-08-03"></label><label>כיתה<select><option>אודם</option></select></label><label>התחלה<input type="time" value="07:30"></label><label>סיום<input type="time" value="15:30"></label><label class="full-field">תפקיד באותו יום<select><option>צוות כיתה</option></select></label></div><section class="shift-recommendation-section"><div class="shift-recommendation-heading"><div><strong>העובדים המתאימים ביותר</strong><small>בהתאם לזמינות, כיתה, שעות ואילוצים.</small></div><span class="status-chip ok">4 התאמות</span></div><div class="shift-recommendations"><button class="shift-recommendation-card level-high"><span class="recommendation-rank">1</span><div><strong>שושנה לוי</strong><small>סייעת/ סייע · הכיתה הקבועה</small></div><span class="match-score is-compact"><span><strong>94</strong><small>התאמה</small></span><i><b style="width:94%"></b></i></span></button><button class="shift-recommendation-card level-good"><span class="recommendation-rank">2</span><div><strong>רחל כהן</strong><small>משלימ/ת מקום · פנויה</small></div><span class="match-score is-compact"><span><strong>81</strong><small>התאמה</small></span><i><b style="width:81%"></b></i></span></button></div></section><section class="full-field shift-employee-picker"><div class="employee-picker-title"><div><strong>בחירת עובד</strong><small>חיפוש וכל האפשרויות הזמינות</small></div><span class="selected-score-pill">94/100</span></div><label class="employee-picker-search"><span>⌕</span><input type="search" placeholder="חיפוש עובד לפי שם או תפקיד"></label><div class="shift-employee-options"><div class="employee-option-group"><span>מומלצים</span><button class="shift-employee-option selected"><span class="employee-option-avatar">של</span><span class="employee-option-copy"><strong>שושנה לוי</strong><small>סייעת/ סייע · הכיתה הקבועה</small></span><span class="match-score is-compact"><span><strong>94</strong><small>התאמה</small></span><i><b style="width:94%"></b></i></span></button><button class="shift-employee-option"><span class="employee-option-avatar">רכ</span><span class="employee-option-copy"><strong>רחל כהן</strong><small>משלימ/ת מקום · פנויה כל היום</small></span><span class="match-score is-compact"><span><strong>81</strong><small>התאמה</small></span><i><b style="width:81%"></b></i></span></button></div><div class="employee-option-group"><span>אפשרויות נוספות</span><button class="shift-employee-option"><span class="employee-option-avatar">דא</span><span class="employee-option-copy"><strong>דנה אברהם</strong><small>רוטציה · תואם שעות</small></span><span class="match-score is-compact"><span><strong>64</strong><small>התאמה</small></span><i><b style="width:64%"></b></i></span></button></div></div></section><div class="modal-actions"><button class="ghost-btn">ביטול</button><button class="primary-btn">שמירת השיבוץ</button></div></form></dialog><pre id="qaMetrics" style="display:none"></pre><script>addEventListener('load',()=>{const d=document.querySelector('.modal-card').getBoundingClientRect(),vw=document.documentElement.clientWidth;const rs=[...document.querySelectorAll('button,input,select')].map(e=>e.getBoundingClientRect());qaMetrics.textContent=JSON.stringify({clientWidth:vw,scrollWidth:document.documentElement.scrollWidth,dialog:{left:d.left,right:d.right,width:d.width},outside:rs.filter(r=>r.left<-.5||r.right>vw+.5).length,small:rs.filter(r=>r.width<36||r.height<36).length,controls:rs.length});});</script></body></html>
